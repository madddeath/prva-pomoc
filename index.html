<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprievodca prvej pomoci (prototyp)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b71c1c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prvá pomoc">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1b1d21;font-size:18px;line-height:1.4}
header{position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#b71c1c;color:#fff}
.brand{font-weight:700;font-size:16px}
.calls{display:flex;gap:6px}
.call{background:#fff;color:#b71c1c;font-weight:800;text-decoration:none;padding:7px 13px;border-radius:999px;font-size:17px}
.call.alt{background:#ffcdd2}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid #e2e4e8}
.tools button{flex:0 0 auto;border:1px solid #d5d8de;background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;color:#333;cursor:pointer}
.tools button.on{background:#1565c0;color:#fff;border-color:#1565c0}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
.step{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;font-weight:700;display:flex;align-items:center;gap:10px}
.big{font-size:42px;line-height:1}
h1{font-size:25px;margin:8px 0 8px;line-height:1.2}
.q{font-size:20px;margin:0 0 8px}
.hint{background:#fff8e1;border-left:4px solid #f9a825;padding:8px 10px;border-radius:6px;font-size:16px;margin:10px 0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 14px;border:2px solid #d5d8de;background:#fff;border-radius:14px;font-size:19px;text-align:left;color:#1b1d21;cursor:pointer;text-decoration:none;font-family:inherit}
.opt:active{transform:scale(.98)}
.opt .ico{font-size:28px;width:36px;text-align:center;flex:0 0 36px}
.opt .num{margin-left:auto;font-size:13px;color:#9aa0a8;padding-left:8px}
.opt.sel{border-color:#1565c0;background:#e3f2fd}
.opt.sel .num::after{content:" ✓";color:#1565c0;font-weight:800}
.opt.primary{background:#1565c0;color:#fff;border-color:#1565c0;font-weight:700}
.opt.danger{background:#c62828;color:#fff;border-color:#c62828;font-weight:800}
.opt.ghost{background:transparent;border-style:dashed;min-height:54px;font-size:17px}
.alert{background:#ffebee;border:3px solid #c62828;border-radius:16px;padding:16px}
.alert h1{color:#b71c1c}
.result{border-radius:16px;padding:16px;color:#fff}
.result.red{background:#c62828}.result.orange{background:#e65100}.result.green{background:#2e7d32}.result.yellow{background:#f9c623;color:#1b1d21}.result.yellow h1{color:#1b1d21}
.result h1{color:#fff;margin:4px 0}
ul.list,ol.list{padding-left:22px;margin:8px 0}
.list li{margin:7px 0}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-top:14px;border:1px solid #e2e4e8}
.card h2{font-size:17px;margin:2px 0 4px}
pre.sum{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;background:#fff;border:1px solid #d5d8de;border-radius:12px;padding:12px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid #c5c9d0;background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;cursor:pointer;font-family:inherit}
.chip.sel{background:#1565c0;color:#fff;border-color:#1565c0}
.pulse{width:150px;height:150px;margin:16px auto 6px;border-radius:50%;background:#c62828;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:800;transition:transform .08s;user-select:none}
.pulse small{font-size:13px;font-weight:600;opacity:.9}
.pulse.beat{transform:scale(.84)}
.center{text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;z-index:10}
#toast.show{opacity:.95}
.small{font-size:14px;color:#6b7280}
.tag{display:inline-block;background:#e8eaed;border-radius:6px;padding:1px 7px;font-size:13px;margin-right:4px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">🩺 Sprievodca prvej pomoci</div>
    <div class="calls">
      <a class="call" href="tel:155" target="_top" data-call="155">📞 155</a>
      <a class="call alt" href="tel:112" target="_top" data-call="112">112</a>
    </div>
  </div>
  <div class="tools">
    <button id="bBack">← Späť</button>
    <button id="bTts" class="on">🔊 Hlas</button>
    <button id="bMic">🎤 Hovoriť</button>
    <button id="bSum">📋 Súhrn</button>
    <button id="bNew">⟲ Znova</button>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=()=>new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3200)}

/* ================= state ================= */
function fresh(){return{node:'START',f:{},log:[],alerts:[],hist:[],scen:'',onset:false,onsetH:null,onsetTxt:'',called:{},patient:{sex:'',age:''},after:null,cprStart:null}}
let S=fresh();
let CUR=[];           // current voice targets
let timers=[];        // intervals for current screen
function addLog(k,txt){S.log.push({k,t:tm(),txt})}
function logCall(num){if(!S.called[num]){S.called[num]=true;addLog('a','Volané '+num)}}
function snap(){const {hist,...rest}=S;return JSON.stringify(rest)}
function pushHist(){S.hist.push(snap())}
function back(){if(!S.hist.length){toast('Si na začiatku');return}const h=S.hist;const st=JSON.parse(h.pop());S={...st,hist:h};show(S.node)}

/* ================= content ================= */
const onsetOpts=next=>[
 {l:'Pred chvíľou (do 1 hodiny)',ico:'⏱️',h:1,kw:['chvilou','chvilu','do hodiny','pred chvilkou']},
 {l:'Pred 1 – 4 hodinami',ico:'🕐',h:4,kw:['jednu az styri','jedna az styri','par hodin']},
 {l:'Pred 4 – 24 hodinami',ico:'🕓',h:24,kw:['dnes','rano','vcera','dvadsatstyri']},
 {l:'Dlhšie, zhoršuje sa postupne',ico:'📅',h:99,kw:['dlhsie','postupne','dni']},
 {l:'Neviem',ico:'❓',h:null,kw:['neviem']}
].map(o=>({...o,go:next,set:S=>{S.onset=true;S.onsetH=o.h;S.onsetTxt=o.l}}));

const N={
START:{type:'start'},

/* --- Ležiaci človek --- */
L1:{step:'Krok 1 · Bezpečnosť',ico:'⚠️',t:'Je miesto bezpečné?',
 q:'Skôr než k nemu pristúpiš, rozhliadni sa: doprava, elektrina, plyn, oheň, agresívny človek.',
 opts:[
  {l:'Áno, je bezpečné',ico:'✅',go:'L2',kw:['ano','bezpecne','idem']},
  {l:'Nie je bezpečné',ico:'⛔',alert:'danger',go:'L2',f:'Nebezpečné prostredie na mieste',kw:['nie','nebezpecne']}]},
L2:{step:'Krok 2 · Vedomie',ico:'🗣️',t:'Reaguje?',
 q:'Nahlas ho osloviť („Haló, počujete ma?") a jemne mu zatriasť ramenami.',
 opts:[
  {l:'Otvorí oči, hovorí alebo sa hýbe',ico:'🙂',f:'Reaguje na oslovenie',go:'C1',kw:['otvori','hovori','hybe','reaguje']},
  {l:'Len stoná / reaguje až na bolesť',ico:'😣',f:'Reaguje len na bolestivý podnet / stoná',flag:'drowsy',go:'L3',kw:['stona','bolest']},
  {l:'Nereaguje vôbec',ico:'😶',f:'Nereaguje na oslovenie ani zatrasenie',flag:'unresp',go:'L3',kw:['nereaguje','vobec','nic']}]},
L3:{step:'Krok 3 · Dýchanie',ico:'🌬️',t:'Dýcha normálne?',
 q:'Otoč ho na chrbát a zaklon mu hlavu (ruka na čelo, dva prsty pod bradu). Pozeraj na hrudník, počúvaj a cíť dych pri ústach – najviac 10 sekúnd.',
 hint:'Ojedinelé lapavé „vzdychy" NIE sú normálne dýchanie. Ak si nie si istý, ber to ako „nedýcha".',
 opts:[
  {l:'Dýcha normálne',ico:'🌬️',f:'Dýcha normálne',alert:'unc',go:'L4',kw:['dycha','normalne']},
  {l:'Nedýcha / len lapá po dychu',ico:'🚫',f:'Nedýcha normálne (bez dychu / lapavé dychy)',flag:'cardiac',go:'CPR',kw:['nedycha','lapa']},
  {l:'Neviem posúdiť',ico:'❓',f:'Dýchanie nejasné – postup ako pri zástave',flag:'cardiac',go:'CPR',kw:['neviem']}]},
L4:{type:'multi',step:'Kým čakáš na záchranku',ico:'🔎',t:'Čo vidíš pri ňom alebo na ňom?',
 q:'Označ všetko, čo platí, potom „Hotovo". Stále sleduj, či dýcha.',none:'Bez ďalších nápadných stôp',
 items:[
  {l:'Glukomer, inzulín, náramok diabetika',ico:'💉',flag:'diab',f:'Pri ňom pomôcky diabetika',kw:['glukomer','inzulin','diabet']},
  {l:'Poranenie alebo krv na hlave',ico:'🤕',flag:'head',f:'Poranenie hlavy',kw:['hlave','hlava','poranenie']},
  {l:'Silné krvácanie',ico:'🩸',flag:'bleed',alert:'bleed',f:'Silné krvácanie',kw:['krvacanie','krvaca']},
  {l:'Zápach alkoholu',ico:'🍺',flag:'alcohol',f:'Zápach alkoholu',kw:['alkohol']},
  {l:'Lieky / prázdne obaly',ico:'💊',flag:'meds',f:'Pri ňom lieky / prázdne obaly (odovzdať záchranke)',kw:['lieky','obaly']},
  {l:'Zvratky',ico:'🤢',flag:'vomit',f:'Zvracal',kw:['zvratky','zvracal']},
  {l:'Pomočený, pohryzený jazyk',ico:'⚡',flag:'seizure',f:'Známky prekonaných kŕčov (pomočenie / pohryzený jazyk)',kw:['pomoceny','jazyk','krce']},
  {l:'Koža studená, bledá, spotená',ico:'💧',flag:'sweat',f:'Bledá, studená, spotená koža',kw:['studena','spotena','bleda']},
  {l:'Koža horúca',ico:'🌡️',flag:'fever',f:'Horúca koža',kw:['horuca']}],
 opts:[{l:'Prebral sa a hovorí',ico:'🙂',f:'Prebral sa, komunikuje',go:'C1',cls:'ghost',kw:['prebral']}],
 next:'RESULT'},
CPR:{type:'cpr'},

/* --- Blízky sa nezdá / úraz --- */
B0:{step:'Začiatok ťažkostí',ico:'🕐',t:'Kedy bol naposledy úplne v poriadku?',
 q:'Pri mozgovej príhode je tento čas pre lekárov veľmi dôležitý.',opts:onsetOpts('B1')},
B1:{step:'Vedomie',ico:'🗣️',t:'Ako reaguje, keď sa mu prihovoríš?',
 opts:[
  {l:'Je hore a komunikuje',ico:'🙂',f:'Pri vedomí, komunikuje',go:'C1',kw:['komunikuje','hore','hovori']},
  {l:'Spavý, ťažko sa prebúdza',ico:'😴',f:'Spavý, ťažko prebuditeľný',flag:'drowsy',alert:'drowsy',go:'C1',kw:['spavy','prebudza','spi']},
  {l:'Nereaguje',ico:'😶',f:'Nereaguje na oslovenie',flag:'unresp',go:'L3',kw:['nereaguje']}]},

/* --- Posúdenie pri vedomí --- */
C1:{step:'Orientácia',ico:'❔',t:'Vie, kto je, kde je a kedy?',
 q:'Opýtaj sa: „Ako sa voláte? Kde sme? Aký je dnes deň?"',
 opts:[
  {l:'Odpovedá správne',ico:'✅',f:'Orientovaný (meno, miesto, čas)',kw:['spravne','vie']},
  {l:'Čiastočne, mýli sa',ico:'🤔',flag:'confused',f:'Čiastočne dezorientovaný',kw:['ciastocne','myli']},
  {l:'Nezmyselne alebo vôbec',ico:'😵',flag:'severeConf',f:'Výrazne dezorientovaný, nezmyselné odpovede',kw:['nezmyselne','vobec']}],
 next:S=>(S.f.confused||S.f.severeConf)?'C1b':'C2'},
C1b:{step:'Orientácia',ico:'❔',t:'Je to u neho nové?',
 q:'Alebo je zmätený bežne (napr. pri demencii)?',
 opts:[
  {l:'Nové / horšie než zvyčajne',ico:'🆕',flag:'newConf',f:'Zmätenosť je nová / horšia než zvyčajne',kw:['nove','horsie']},
  {l:'Taký je bežne',ico:'🏠',f:'Zmätenosť je jeho obvyklý stav',set:S=>{S.f.confused=false;S.f.severeConf=false},kw:['bezne','zvycajne']},
  {l:'Neviem',ico:'❓',flag:'newConf',f:'Nevedno, či je zmätenosť nová',kw:['neviem']}],
 next:'C2'},
C2:{step:'Test FAST · Tvár',ico:'😁',t:'Je tvár súmerná?',
 q:'Požiadaj ho, nech sa usmeje alebo vyceri zuby.',
 opts:[
  {l:'Súmerná',ico:'✅',f:'Tvár súmerná',kw:['sumerna','normalna']},
  {l:'Pokles kútika / jedna strana visí',ico:'⚠️',flag:'stroke',alert:'stroke',f:'Asymetria tváre (pokles kútika)',kw:['pokles','visi','kutik','strana']},
  {l:'Nevie spolupracovať',ico:'❓',f:'Test tváre sa nedal vykonať',kw:['nevie','spolupracovat']}],
 next:'C3'},
C3:{step:'Test FAST · Ruky',ico:'🙌',t:'Udrží obe ruky?',
 q:'Nech zdvihne obe ruky vystreté pred seba, dlaňami hore, a na 10 sekúnd zatvorí oči.',
 opts:[
  {l:'Drží obe rovnako',ico:'✅',f:'Obe ruky udrží',kw:['drzi','rovnako']},
  {l:'Jedna klesá alebo ju nezdvihne',ico:'⚠️',flag:'stroke',alert:'stroke',f:'Slabosť / pokles jednej ruky',kw:['klesa','nezdvihne','jedna']},
  {l:'Nevie spolupracovať',ico:'❓',f:'Test rúk sa nedal vykonať',kw:['nevie','spolupracovat']}],
 next:'C4'},
C4:{step:'Test FAST · Reč',ico:'💬',t:'Hovorí normálne?',
 q:'Nech zopakuje vetu: „Dnes je pekný slnečný deň."',
 opts:[
  {l:'Zopakuje normálne',ico:'✅',f:'Reč bez zjavnej poruchy',kw:['zopakuje','normalne']},
  {l:'Nezrozumiteľne, mrmle, zlé slová',ico:'⚠️',flag:'stroke',alert:'stroke',f:'Porucha reči (nezrozumiteľná / zlé slová)',kw:['nezrozumitelne','mrmle','zle']},
  {l:'Nedokáže hovoriť',ico:'🚫',flag:'stroke',alert:'stroke',f:'Nedokáže hovoriť',kw:['nedokaze','nehovori']}],
 next:S=>S.onset?'C6':'C5'},
C5:{step:'Začiatok ťažkostí',ico:'🕐',t:'Kedy to začalo?',
 q:'Kedy bol naposledy úplne v poriadku?',opts:onsetOpts('C6')},
C6:{step:'Hrudník',ico:'💔',t:'Bolesť alebo tlak na hrudi?',
 q:'Môže vyžarovať do ruky, krku, sánky alebo chrbta.',
 hint:'U žien, starších ľudí a diabetikov sa infarkt môže prejaviť len slabosťou, dýchavicou, nevoľnosťou alebo bolesťou brucha.',
 opts:[
  {l:'Áno',ico:'⚠️',flag:'mi',alert:'mi',f:'Bolesť / tlak na hrudi',kw:['ano','boli','tlak','tlaci']},
  {l:'Nie',ico:'✅',f:'Bez bolesti na hrudi',kw:['nie']},
  {l:'Nevie povedať',ico:'❓',f:'Bolesť na hrudi sa nedá zistiť',kw:['nevie','neviem']}],
 next:'C7'},
C7:{step:'Dýchanie',ico:'🫁',t:'Ako dýcha?',
 opts:[
  {l:'Normálne',ico:'✅',f:'Dýchanie bez námahy',kw:['normalne']},
  {l:'Zadýchava sa aj v pokoji',ico:'😮‍💨',flag:'dysp',alert:'dysp',f:'Dýchavica v pokoji',kw:['zadychava','pokoji']},
  {l:'Veľmi ťažko, nedopovie vetu',ico:'🚨',flag:'dysp',alert:'dysp',f:'Ťažká dýchavica, nedopovie vetu',kw:['tazko','vetu']}],
 next:'C8'},
C8:{type:'multi',step:'Koža',ico:'✋',t:'Pozri sa a dotkni sa kože',
 q:'Označ, čo platí (čelo, krk, ruky, pery).',none:'Koža bez nápadností',
 items:[
  {l:'Bledá, studená, spotená',ico:'💧',flag:'sweat',f:'Bledá, studená, spotená koža',kw:['bleda','studena','spotena']},
  {l:'Horúca – asi horúčka',ico:'🌡️',flag:'fever',f:'Horúca koža (horúčka?)',kw:['horuca','horucka']},
  {l:'Suchá koža a suchý jazyk',ico:'🏜️',flag:'dehydr',f:'Suchá koža a jazyk',kw:['sucha','suchy']},
  {l:'Modré pery alebo nechty',ico:'🫐',flag:'dysp',alert:'dysp',f:'Modré pery / nechty',kw:['modre']}],
 next:'C9'},
C9:{step:'Cukrovka',ico:'🩸',t:'Je diabetik?',
 q:'Berie inzulín alebo tabletky na cukor? Pozri aj po glukomeri.',
 opts:[
  {l:'Áno',ico:'💉',flag:'diab',f:'Diabetik',kw:['ano','diabetik']},
  {l:'Nie',ico:'✅',f:'Nie je diabetik',kw:['nie']},
  {l:'Neviem',ico:'❓',kw:['neviem']}],
 next:S=>(S.f.diab||(S.f.sweat&&(S.f.confused||S.f.severeConf||S.f.drowsy)))?'C9b':'C10'},
C9b:{step:'Cukrovka',ico:'🩸',t:'Zmeraj cukor glukomerom',
 q:'Aká je hodnota?',
 opts:[
  {l:'Pod 4 mmol/l (nízky)',ico:'⬇️',flag:'hypo',f:'Glykémia pod 4 mmol/l',go:'SUGAR',kw:['pod','nizky']},
  {l:'4 – 15 mmol/l',ico:'✅',f:'Glykémia 4–15 mmol/l',go:'C10',kw:['normalny']},
  {l:'Nad 15 mmol/l (vysoký)',ico:'⬆️',flag:'hyper',f:'Glykémia nad 15 mmol/l',go:'C10',kw:['nad','vysoky']},
  {l:'Nemám ako zmerať',ico:'❓',f:'Glykémia nezmeraná',kw:['nemam','nezmeram'],
   go:S=>(S.f.diab&&(S.f.sweat||S.f.confused||S.f.severeConf))?'SUGAR':'C10'}]},
SUGAR:{step:'Nízky cukor',ico:'🍬',t:'Podaj cukor – ak vie prehĺtať',
 q:'Ak sedí a bezpečne prehĺta: sladký nápoj (džús, sladená voda) alebo 3–4 kocky cukru. Ak je ospalý alebo sa dusí, nič mu nedávaj. Počkaj 10–15 minút.',
 opts:[
  {l:'Zlepšil sa',ico:'👍',flag:'hypoOk',a:'Podaný cukor – stav sa zlepšil',go:'C10',kw:['zlepsil','lepsie']},
  {l:'Nezlepšil sa',ico:'👎',flag:'hypoBad',a:'Podaný cukor – bez zlepšenia',alert:'generic',go:'C10',kw:['nezlepsil']},
  {l:'Nevie bezpečne prehĺtať',ico:'🚫',flag:'noSwallow',a:'Cukor nepodaný – nevie prehĺtať',alert:'generic',go:'C10',kw:['prehltat','nevie']}]},
C10:{step:'Úraz',ico:'🤕',t:'Spadol alebo sa udrel?',
 opts:[
  {l:'Nie',ico:'✅',kw:['nie']},
  {l:'Pád alebo úder do hlavy',ico:'🤕',flag:'head',f:'Pád / úder do hlavy',kw:['pad','spadol','hlavy','uder']},
  {l:'Silné krvácanie',ico:'🩸',flag:'bleed',alert:'bleed',f:'Silné krvácanie',kw:['krvacanie','krvaca']},
  {l:'Neviem',ico:'❓',kw:['neviem']}],
 next:'C11'},
C11:{step:'Tlakomer',ico:'🩺',t:'Máš tlakomer?',
 q:'Zmeraj tlak a pulz v sede, po chvíli pokoja.',
 opts:[
  {l:'Áno, zmeriam',ico:'🩺',go:'C11a',kw:['ano','zmeriam','mam']},
  {l:'Nemám tlakomer',ico:'➜',go:'C12',kw:['nemam','nie']}]},
C11a:{step:'Tlakomer',ico:'🩺',t:'Horný (systolický) tlak',

function assess(){
 const f=S.f,R=[],O=[];
 const conf=f.confused&&f.newConf, sconf=f.severeConf&&f.newConf;
 const sudden=S.onsetH!==null&&S.onsetH<=4;
 const add=(c,a,t)=>{if(c)a.push(t)};
 add(f.cardiac,R,'Nedýchal normálne – resuscitácia');
 add(f.unresp,R,'Nereagoval na oslovenie ani dotyk');
 add(f.drowsy,R,'Porucha vedomia (spavý / reaguje len na bolesť)');
 add(f.stroke,R,'Príznak mozgovej príhody (tvár / ruka / reč)');
 add(f.mi,R,'Bolesť alebo tlak na hrudi');
 add(f.dysp,R,'Ťažké dýchanie');
 add(sconf,R,'Výrazná nová zmätenosť');
 add(conf&&sudden,R,'Náhle vzniknutá zmätenosť (v priebehu hodín)');
 add(f.hypot,R,'Nízky tlak (pod 90)');
 add(f.sweat&&(f.tachy||f.hypot),R,'Studený pot + rýchly pulz / nízky tlak (možný šok)');
 add(f.thunder,R,'Náhla prudká bolesť hlavy');
 add(f.seizure,R,'Kŕče');
 add(f.hypoBad,R,'Nízky cukor bez zlepšenia');
 add(f.noSwallow,R,'Nízky cukor a nevie prehĺtať');
 add(f.bleed,R,'Silné krvácanie');
 add(f.head&&(conf||sconf||f.vomit||f.drowsy),R,'Úraz hlavy + zmätenosť / zvracanie');
 add(f.htn&&(conf||sconf||f.thunder),R,'Veľmi vysoký tlak so zmätenosťou / bolesťou hlavy');
 add(f.brady&&(conf||f.sweat||f.drowsy),R,'Pomalý pulz so zmätenosťou / potením');
 add(f.ataxia&&S.onsetH!==null&&S.onsetH<=24,R,'Náhla porucha chôdze / rovnováhy (môže byť mozgová príhoda)');
 const Y=[],G=[];
 const sys=f.fever&&(conf||f.dehydr||f.vomit||f.tachy);
 add(conf&&!sudden,O,'Nová zmätenosť – u starších často infekcia, dehydratácia, lieky alebo cukor');
 add(f.ataxia&&!(S.onsetH!==null&&S.onsetH<=24),Y,'Postupne sa zhoršujúca neistota pri chôdzi');
 add(sys,O,'Horúčka spolu so zmätenosťou / dehydratáciou / zvracaním / rýchlym pulzom');
 add(f.fever&&!sys,Y,'Horúčka bez ďalších varovných príznakov');
 add(f.dehydr&&(conf||f.vomit||f.fever),O,'Dehydratácia spolu s ďalšími príznakmi');
 add(f.dehydr&&!(conf||f.vomit||f.fever),Y,'Málo pije – treba dopĺňať tekutiny');
 add(f.uti&&(f.fever||conf),O,'Močová infekcia s horúčkou / zmätenosťou');
 add(f.uti&&!(f.fever||conf),Y,'Príznaky močovej infekcie');
 add(f.htn,O,'Tlak nad 180');
 add(f.htnMild,Y,'Zvýšený tlak 140–180 (opakovať meranie, riešiť s lekárom)');
 add(f.tachy,O,'Pulz nad 120');
 add(f.brady,O,'Pulz pod 50');
 add(f.irreg&&(f.tachy||f.brady||f.sweat||f.dysp),O,'Nepravidelný pulz s ďalšími príznakmi');
 add(f.irreg&&!(f.tachy||f.brady||f.sweat||f.dysp),Y,'Nepravidelný pulz (môže byť fibrilácia predsiení – treba EKG)');
 add(f.head,O,'Pád / úder do hlavy (riziko neskoršieho krvácania, najmä pri liekoch na riedenie krvi)');
 add(f.hypoOk,O,'Nízky cukor – po podaní cukru zlepšenie (prebrať s lekárom ešte dnes)');
 add(f.hyper&&(conf||f.vomit||f.dehydr),O,'Vysoký cukor s ďalšími príznakmi');
 add(f.hyper&&!(conf||f.vomit||f.dehydr),Y,'Vysoký cukor (nad 15)');
 add(f.meds,O,'Zmena liekov / možné predávkovanie');
 add(f.vomit,O,'Zvracanie');
 add(f.abd,O,'Silná bolesť brucha');
 add(f.sweat,O,'Bledý, studený pot');
 add(f.alcohol,G,'Zápach alkoholu – NEvylučuje iné príčiny (cukor, úraz hlavy, mozgová príhoda)');
 const level=R.length?'red':O.length?'orange':Y.length?'yellow':'green';
 return{level,R,O,Y,G,label:{red:'VOLAJ 155 HNEĎ',orange:'LEKÁR EŠTE DNES',yellow:'VŠEOBECNÝ LEKÁR V NAJBLIŽŠÍCH DŇOCH',green:'VYZERÁ TO DOBRE'}[level]};
}

function summaryText(){

 let s=`SÚHRN PRE ZÁCHRANKU / LEKÁRA\n${d.toLocaleDateString('sk-SK')} ${tm()}\n`;
 s+=`Situácia: ${S.scen||'–'}\n`;
 const p=[S.patient.sex,S.patient.age].filter(Boolean).join(', ');
 if(p)s+=`Pacient: ${p}\n`;
 if(S.onsetTxt)s+=`Naposledy v poriadku: ${S.onsetTxt.toLowerCase()}\n`;
 const F=S.log.filter(x=>x.k==='f'),A=S.log.filter(x=>x.k==='a');
 s+='\nZISTENIA:\n'+(F.length?F.map(x=>`• ${x.t}  ${x.txt}`).join('\n'):'• –');
 s+='\n\nVYKONANÉ:\n'+(A.length?A.map(x=>`• ${x.t}  ${x.txt}`).join('\n'):'• –');
 s+=`\n\nVÝSLEDOK SPRIEVODCU: ${r.label}`;
 if(r.R.length)s+='\n'+r.R.map(x=>'! '+x).join('\n');
 if(r.O.length)s+='\n'+r.O.map(x=>'• (dnes) '+x).join('\n');
 if(r.Y.length)s+='\n'+r.Y.map(x=>'• (do pár dní) '+x).join('\n');
 if(r.G.length)s+='\n'+r.G.map(x=>'• '+x).join('\n');
 s+='\n\n(Laické posúdenie, nie diagnóza.)';
 return s;
}

let ttsOn=true,voice=null,speaking=false,voiceWarned=false;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/^sk/i.test(v.lang))||vs.find(v=>/^cs/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const clean=t=>(t||'').replace(/\p{Extended_Pictographic}|️|‍/gu,'').replace(/[„"“]/g,'').replace(/–/g,',');
function speak(t){
 if(!ttsOn||!('speechSynthesis' in window)){if(listening)startRec();return}
 speechSynthesis.cancel();
 if(!voice){pickVoice();if(!voice&&!voiceWarned){voiceWarned=true;toast('V zariadení chýba slovenský hlas – doinštaluj ho v nastaveniach (Prevod textu na reč)')}}
 const u=new SpeechSynthesisUtterance(clean(t));
 u.lang=voice?voice.lang:'sk-SK';if(voice)u.voice=voice;u.rate=1.02;
 u.onend=u.onerror=()=>{speaking=false;if(listening)startRec()};
 speaking=true;pauseRec();speechSynthesis.speak(u);
}
function nodeSpeech(n){

 if(n.type==='cpr')return'Volaj 155. Stláčaj stred hrudníka, päť až šesť centimetrov hlboko, sto až stodvadsať krát za minútu. Spusti metronóm a stláčaj do rytmu.';
 if(n.type==='start')return'Čo sa deje?';
 let t=[n.t,n.q].filter(Boolean).join('. ');
 if(listening){const l=(n.items||n.opts||[]).map(o=>o.l);if(l.length)t+='. Možnosti: '+l.join('; ')+(n.items?'; a potom povedz hotovo':'')}

}

function pauseRec(){try{rec&&rec.abort()}catch(e){}}

 pauseRec();
 rec=new SR();rec.lang='sk-SK';rec.interimResults=false;rec.maxAlternatives=3;

}
const ORD=[['prva','prvu','prvy','jedna','jednotka'],['druha','druhu','druhy','dva','dvojka'],['tretia','tretiu','treti','tri','trojka'],['stvrta','stvrtu','styri','stvorka'],['piata','piatu','pat','patka'],['siesta','siestu','sest']];
function handleVoice(alts){
 toast('🎤 „'+(alts[0]||'')+'"');
 for(const raw of alts){
  const t=norm(raw),p=' '+t+' ';
  if(/ (spat|naspat) /.test(p)){back();return}
  if(/ (suhrn) /.test(p)){showSummary();return}
  if(/ (opakuj|zopakuj|este raz) /.test(p)){speakNode();return}
  let best=null,bl=0;
  CUR.forEach(c=>c.kw.forEach(k=>{if(!k)return;const hit=k.length>=4?t.includes(k):p.includes(' '+k+' ');if(hit&&k.length>bl){bl=k.length;best=c}}));
  if(best){best.act();return}
 }
 const p=' '+norm(alts[0])+' ';
 for(let i=0;i<ORD.length;i++)if(ORD[i].some(w=>p.includes(' '+w+' '))){const c=CUR.find(c=>c.i===i);if(c){c.act();return}}
 toast('Nerozumel som – zopakuj alebo klikni');
}
function kwOf(o){const l=norm(o.l);const first=l.split(' ')[0];return[...(o.kw||[]).map(norm),l,first.length>=4?first:''].filter(Boolean)}

 const S0=[
  {l:'Niekto leží, nereaguje alebo je dezorientovaný',ico:'🧍',go:'L1',scen:'Nájdená ležiaca / dezorientovaná osoba',kw:['lezi','nereaguje','dezorientovany','lezaci']},
  {l:'Blízky sa nezdá – zmätený, slabý, mrmle',ico:'👵',go:'B0',scen:'Zmena stavu blízkej osoby',kw:['nezda','babka','zmateny','mrmle','slaby']},
  {l:'Bolesť na hrudi alebo ťažko dýcha',ico:'💔',go:'C5',scen:'Bolesť na hrudi / dýchavica',kw:['hrudi','hrud','dycha','srdce','infarkt']},
  {l:'Úraz alebo pád',ico:'🩹',go:'B0',scen:'Úraz / pád',set:S=>{S.f.head=false},kw:['uraz','pad','spadol']}];
 S0.forEach((o,i)=>{const act=()=>{if(!S.start){S.start=tm()}speak('');choose(N.START,{...o,set:S=>{S.scen=o.scen}})};box.append(optBtn(o,i,act));reg(o,i,act)});
 w.append(box);
 const c=el('div','card',`<h2>Ako to funguje</h2>
  <ul class="list small">
   <li>Postupne ťa prevedie základným posúdením: vedomie, dýchanie, test mozgovej príhody (FAST), hrudník, cukor, tlak.</li>
   <li>Pri vážnom zistení hneď zobrazí, čo robiť, a tlačidlo na 155.</li>
   <li>Na konci dostaneš odporúčanie a <b>súhrn pre záchranku / lekára</b> (tlačidlo 📋).</li>
   <li>🔊 pokyny číta nahlas, 🎤 odpovede môžeš hovoriť (napr. „áno", „nie", „prvá", „hotovo", „späť").</li>
  </ul>
  <p class="small"><span class="tag">PROTOTYP</span>Nie je to zdravotnícka pomôcka ani diagnóza. Pri akejkoľvek pochybnosti volaj <b>155</b> – operátor ťa prevedie aj telefonicky.</p>`);
 w.append(c);app.append(w);
}
let metroOn=false,ac=null;
function renderCPR(){
 if(!S.cprStart){S.cprStart=Date.now();addLog('a','Začatá resuscitácia (stláčanie hrudníka)')}
 const w=el('div','alert');
 w.append(el('div','step','<span class="big">🫀</span><span>Zástava – resuscitácia</span>'));
 w.append(el('h1','','Stláčaj hrudník'));
 w.append(el('ol','list',`<li><b>Volaj 155</b> na hlasitý odposluch – operátor ťa povedie.</li>
  <li>Ak je niekto pri tebe, pošli ho po <b>defibrilátor (AED)</b>.</li>
  <li>Dlane na stred hrudníka, ruky vystreté. Stláčaj <b>5–6 cm hlboko, 100–120× za minútu</b>.</li>
  <li>Vdychy len ak ich vieš (30 stlačení : 2 vdychy). Inak len stláčaj bez prestávky.</li>
  <li>Nezastavuj, kým nepríde záchranka, AED alebo kým nezačne normálne dýchať.</li>`));
 const box=el('div','opts');box.append(callBtn('155'));w.append(box);
 const pulse=el('div','pulse','<span id="cnt">0</span><small>stlačení</small>');
 const info=el('p','center small','Čas KPR: <b id="el">0:00</b>');
 const mb=el('button','opt primary','<span class="ico">▶</span><span>Spustiť metronóm (110/min)</span>');
 let n=0,beat=null;
 const tick=()=>{n++;const c=$('#cnt');if(c)c.textContent=n;pulse.classList.add('beat');setTimeout(()=>pulse.classList.remove('beat'),90);
  if(ac){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=n%30===0?1320:880;
   g.gain.setValueAtTime(.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.07);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}};
 const toggle=()=>{
  if(beat){clearInterval(beat);timers=timers.filter(t=>t!==beat);beat=null;mb.innerHTML='<span class="ico">▶</span><span>Spustiť metronóm (110/min)</span>';return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){ac=null}
  if(speaking)speechSynthesis.cancel();
  beat=setInterval(tick,545);timers.push(beat);tick();mb.innerHTML='<span class="ico">⏸</span><span>Zastaviť metronóm</span>'};
 mb.onclick=toggle;CUR.push({kw:['metronom','spusti','start','zastav'],i:-1,act:toggle});
 const et=setInterval(()=>{const s=Math.floor((Date.now()-S.cprStart)/1000);const e=$('#el');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);timers.push(et);
 w.append(pulse,info);
 const b2=el('div','opts');b2.append(mb);
 const node={next:'RESULT'};
 [{l:'Začal normálne dýchať',ico:'🌬️',a:'Obnovené dýchanie – KPR ukončená',go:S=>{S.after='L4';return'AL_unc'},kw:['dycha','zacal']},
  {l:'Priniesli AED – zapínam ho',ico:'⚡',a:'Priniesli AED, postup podľa jeho pokynov',go:'CPR',kw:['aed','defibrilator','priniesli']},
  {l:'Záchranka prevzala',ico:'🚑',a:'Záchranka prevzala pacienta',go:'RESULT',kw:['zachranka','prevzala','prisli']}]
  .forEach((o,i)=>{const act=()=>{if(o.go==='AL_unc'){}choose(node,o)};b2.append(optBtn(o,i,act));reg(o,i,act)});
 w.append(b2);app.append(w);
}
function getDoc(){try{return localStorage.getItem('mojLekar')||''}catch(e){return''}}
function setDoc(v){try{localStorage.setItem('mojLekar',v)}catch(e){}}
function docBox(){
 const d=el('div','card');
 const num=getDoc();
 d.append(el('h2','','👩‍⚕️ Môj lekár'));
 const row=el('div','');
 const inp=el('input');inp.type='tel';inp.placeholder='Telefón všeobecného lekára';inp.value=num;
 inp.style.cssText='width:100%;font-size:18px;padding:10px 12px;border:1px solid #c5c9d0;border-radius:10px;margin:4px 0 8px';
 const call=el('a','opt danger','');
 const upd=()=>{const n=inp.value.replace(/[^0-9+]/g,'');call.href='tel:'+n;call.style.display=n?'flex':'none';
  call.innerHTML=`<span class="ico">📞</span><span>Volať lekárovi</span><span class="num" style="color:#ffcdd2">${esc(inp.value)}</span>`};
 inp.oninput=()=>{setDoc(inp.value);upd()};
 call.target='_top';call.onclick=()=>{const n=inp.value;if(!S.called['lekar']){S.called['lekar']=true;addLog('a','Volané lekárovi ('+n+')')}toast('Ak sa hovor nespustil, vytoč '+n+' ručne')};
 CUR.push({kw:['lekarovi','zavolaj lekara'],i:-1,act:()=>toast('Vytoč '+(inp.value||'číslo lekára'))});
 upd();row.append(inp,call);d.append(row);
 d.append(el('p','small','Číslo sa uloží v tomto zariadení. Mimo ordinačných hodín: pohotovosť (LSPP) alebo 155.'));
 return d;
}
function renderResult(){
 const r=assess();
 const w=el('div');
 const c=el('div','result '+r.level,`<div class="step" style="color:inherit;opacity:.85"><span class="big">${{red:'🚑',orange:'🩺',yellow:'📅',green:'✅'}[r.level]}</span><span>Výsledok</span></div><h1>${r.label}</h1>`);
 c.append(el('ul','list',ADVICE[r.level].map(x=>`<li>${esc(x)}</li>`).join('')));
 w.append(c);
 const card=(arr,t)=>{if(arr.length)w.append(el('div','card',`<h2>${t}</h2><ul class="list">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`))};
 card(r.R,'🔴 Varovné zistenia – záchranka');card(r.O,'🟠 Riešiť ešte dnes');card(r.Y,'🟡 Prebrať s lekárom v najbližších dňoch');card(r.G,'ℹ️ Poznámky');
 const box=el('div','opts');
 if(r.level==='red')box.append(callBtn('155'));
 if(r.level==='orange'||r.level==='yellow')w.append(docBox());
 if(r.level==='orange')box.append(callBtn('155'));
 const acts=[
  {l:'Súhrn pre záchranku / lekára',ico:'📋',cls:'primary',run:showSummary,kw:['suhrn']},
  ...(r.level==='red'?[{l:'Prestal dýchať → resuscitácia',ico:'🫀',run:()=>choose(N.RESULT,{flag:'cardiac',f:'Prestal dýchať',go:'CPR'}),kw:['prestal','nedycha']}]:[]),
  {l:'Zopakovať kontrolu',ico:'🔁',run:()=>choose(N.RESULT,{a:'Opakovaná kontrola stavu',go:'C1'}),kw:['zopakovat','kontrolu']},
  {l:'Nové posúdenie',ico:'⟲',cls:'ghost',run:restart,kw:['nove','znova']}];
 acts.forEach((o,i)=>{box.append(optBtn(o,i,o.run));reg(o,i,o.run)});
 w.append(box);app.append(w);
}
function showSummary(){
 stopScreen();app.innerHTML='';CUR=[];window.scrollTo(0,0);
 const w=el('div');
 w.append(el('div','step','<span class="big">📋</span><span>Súhrn</span>'));
 w.append(el('h1','','Súhrn pre záchranku / lekára'));
 w.append(el('p','small','Doplň, ak vieš (nepovinné):'));
 const pre=el('pre','sum');
 const chips=(arr,key)=>{const d=el('div','chips');arr.forEach(v=>{const b=el('button','chip'+(S.patient[key]===v?' sel':''),esc(v));
  b.onclick=()=>{S.patient[key]=S.patient[key]===v?'':v;[...d.children].forEach(x=>x.classList.toggle('sel',x.textContent===S.patient[key]));pre.textContent=summaryText()};d.append(b)});return d};
 w.append(chips(['muž','žena'],'sex'),chips(['dieťa','do 40 r.','40–65 r.','nad 65 r.'],'age'));
 pre.textContent=summaryText();w.append(pre);
 const box=el('div','opts');
 [{l:'Kopírovať text',ico:'📄',cls:'primary',run:()=>copyText(summaryText()),kw:['kopirovat']},
  {l:'Prečítať nahlas (napr. operátorovi)',ico:'🔊',run:()=>{const o=ttsOn;ttsOn=true;speak(summaryText().replace(/•|!/g,''));ttsOn=o},kw:['precitat','citaj']},
  {l:'Späť',ico:'←',cls:'ghost',run:()=>show(S.node),kw:['spat','naspat']}]
  .forEach((o,i)=>{box.append(optBtn(o,i,o.run));reg(o,i,o.run)});
 w.append(box);app.append(w);
}
function restart(){speechSynthesis&&speechSynthesis.cancel();const keep=S.patient;S=fresh();show('START')}

/* ================= toolbar ================= */
$('#bBack').onclick=back;
$('#bNew').onclick=restart;
$('#bSum').onclick=showSummary;
$('#bTts').onclick=()=>{ttsOn=!ttsOn;$('#bTts').classList.toggle('on',ttsOn);$('#bTts').textContent=ttsOn?'🔊 Hlas':'🔇 Hlas';if(!ttsOn&&'speechSynthesis' in window)speechSynthesis.cancel();else speakNode()};
$('#bMic').onclick=()=>{
 if(!SR){toast('Tento prehliadač nevie rozpoznávať reč. Skús Chrome na Androide.');return}
 listening=!listening;updMic();
 if(listening){toast('Počúvam. Povedz napr. „áno", „nie", „prvá", „hotovo", „späť".');startRec()}else pauseRec();
};
document.querySelectorAll('[data-call]').forEach(a=>a.addEventListener('click',()=>{logCall(a.dataset.call);toast('Ak sa hovor nespustil, vytoč '+a.dataset.call+' ručne')}));
show('START');
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
