<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprievodca prvej pomoci (prototyp)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b71c1c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prvá pomoc">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1b1d21;font-size:18px;line-height:1.4}
header{position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#b71c1c;color:#fff}
.brand{font-weight:700;font-size:16px}
.calls{display:flex;gap:6px}
.call{background:#fff;color:#b71c1c;font-weight:800;text-decoration:none;padding:7px 13px;border-radius:999px;font-size:17px}
.call.alt{background:#ffcdd2}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid #e2e4e8}
.tools button{flex:0 0 auto;border:1px solid #d5d8de;background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;color:#333;cursor:pointer}
.tools button.on{background:#1565c0;color:#fff;border-color:#1565c0}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
.step{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;font-weight:700;display:flex;align-items:center;gap:10px}
.big{font-size:42px;line-height:1}
h1{font-size:25px;margin:8px 0 8px;line-height:1.2}
.q{font-size:20px;margin:0 0 8px}
.hint{background:#fff8e1;border-left:4px solid #f9a825;padding:8px 10px;border-radius:6px;font-size:16px;margin:10px 0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 14px;border:2px solid #d5d8de;background:#fff;border-radius:14px;font-size:19px;text-align:left;color:#1b1d21;cursor:pointer;text-decoration:none;font-family:inherit}
.opt:active{transform:scale(.98)}
.opt .ico{font-size:28px;width:36px;text-align:center;flex:0 0 36px}
.opt .num{margin-left:auto;font-size:13px;color:#9aa0a8;padding-left:8px}
.opt.sel{border-color:#1565c0;background:#e3f2fd}
.opt.sel .num::after{content:" ✓";color:#1565c0;font-weight:800}
.opt.primary{background:#1565c0;color:#fff;border-color:#1565c0;font-weight:700}
.opt.danger{background:#c62828;color:#fff;border-color:#c62828;font-weight:800}
.opt.ghost{background:transparent;border-style:dashed;min-height:54px;font-size:17px}
.alert{background:#ffebee;border:3px solid #c62828;border-radius:16px;padding:16px}
.alert h1{color:#b71c1c}
.result{border-radius:16px;padding:16px;color:#fff}
.result.red{background:#c62828}.result.orange{background:#e65100}.result.green{background:#2e7d32}.result.yellow{background:#f9c623;color:#1b1d21}.result.yellow h1{color:#1b1d21}
.result h1{color:#fff;margin:4px 0}
ul.list,ol.list{padding-left:22px;margin:8px 0}
.list li{margin:7px 0}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-top:14px;border:1px solid #e2e4e8}
.card h2{font-size:17px;margin:2px 0 4px}
pre.sum{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;background:#fff;border:1px solid #d5d8de;border-radius:12px;padding:12px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid #c5c9d0;background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;cursor:pointer;font-family:inherit}
.chip.sel{background:#1565c0;color:#fff;border-color:#1565c0}
.pulse{width:150px;height:150px;margin:16px auto 6px;border-radius:50%;background:#c62828;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:800;transition:transform .08s;user-select:none}
.pulse small{font-size:13px;font-weight:600;opacity:.9}
.pulse.beat{transform:scale(.84)}
.center{text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92%;text-align:center;z-index:10}
#toast.show{opacity:.95}
.small{font-size:14px;color:#6b7280}
.tag{display:inline-block;background:#e8eaed;border-radius:6px;padding:1px 7px;font-size:13px;margin-right:4px}
.grp{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin:18px 2px 6px}
.opts.grid2{grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.opts.grid2 .opt{min-height:58px;font-size:15.5px;padding:8px 10px;gap:8px}
.opts.grid2 .opt .ico{font-size:22px;width:26px;flex:0 0 26px}
.opts.grid2 .opt .num{display:none}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">🩺 Sprievodca prvej pomoci</div>
    <div class="calls">
      <a class="call" href="tel:155" target="_top" data-call="155">📞 155</a>
      <a class="call alt" href="tel:112" target="_top" data-call="112">112</a>
    </div>
  </div>
  <div class="tools">
    <button id="bBack">← Späť</button>
    <button id="bTts" class="on">🔊 Hlas</button>
    <button id="bMic">🎤 Hovoriť</button>
    <button id="bSum">📋 Súhrn</button>
    <button id="bNew">⟲ Znova</button>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script src="kb.js?v=0.5"></script>
<script src="engine.js?v=0.5"></script>
<script src="app.js?v=0.5"></script>
</body>
</html>
